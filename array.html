<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Array Sort</title>
</head>
<body>

<h2>JavaScript Array Sort</h2>
<p>Click the button to sort the array in ascending order.</p>

<button onclick="ascending()">Ascending order</button>
<button onclick="descending()">Descending order</button>

<p id="result1"></p>
<p id="result2"></p>
<script>
var points = [40, 100, 1, 5, 25, 10];

document.getElementById("result").innerHTML = points;

function ascending() {
    points.sort(function(a, b) {
        return a - b;
    });
    document.getElementById("result1").innerHTML = points;
}

function descending() {
    points.sort(function(a, b) {
        return b - a;
    });
    document.getElementById("result2").innerHTML = points;
}
</script>

</body>
</html>
