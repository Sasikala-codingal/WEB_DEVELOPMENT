<!DOCTYPE html>
<html>
<body>
<h2>JavaScript Arrow Function</h2>
<p>This example shows an Arrow Function with a parameter.</p>
<p id="result"></p>
<p id="res">   </p>
<script>
const add = (a,b) => a + b;
const sub = (a,b) => a - b;

document.getElementById("result").innerHTML = add(4,6);
document.getElementById("res").innerHTML=sub(15,10);
</script>

</body>
</html>
